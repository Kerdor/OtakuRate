[project]
name = "otakurate"
version = "0.1.0"
description = "Personal anime rating application"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.9,<7",
]

[project.scripts]
otakurate = "otakurate.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
